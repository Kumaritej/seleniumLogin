name: Automation Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@latest

      - name: Run Tests
        run: mvn test
        continue-on-error: true

      # NOTE: Change KAN-T1 below to whatever key "Generate Test Case" workflow gave you
      - name: Update Zephyr PASS
        if: success()
        run: |
          curl -i -X POST "https://prod-api.zephyr4jiracloud.com/v2/testexecutions" \
            -H "Authorization: Bearer ${{ secrets.ZEPHYR_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"projectKey\": \"KAN\", \"testCaseKey\": \"KAN-T1\", \"testCycleKey\": \"KAN-R1\", \"statusName\": \"Pass\"}"

      - name: Update Zephyr FAIL
        if: failure()
        run: |
          curl -i -X POST "https://prod-api.zephyr4jiracloud.com/v2/testexecutions" \
            -H "Authorization: Bearer ${{ secrets.ZEPHYR_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"projectKey\": \"KAN\", \"testCaseKey\": \"KAN-T1\", \"testCycleKey\": \"KAN-R1\", \"statusName\": \"Fail\"}"
