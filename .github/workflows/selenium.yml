# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
name: Automation Tests
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'

      - name: Run Tests
        run: mvn test
        continue-on-error: true

      - name: Update Zephyr PASS
        if: success()
        run: |
          curl -i -X POST "https://prod-api.zephyr4jiracloud.com/v2/testexecutions" -H "Authorization: Bearer ${{ secrets.ZEPHYR_TOKEN }}" -H "Content-Type: application/json" -d "{\"projectKey\": \"KAN\", \"testCaseKey\": \"KAN-T8\", \"testCycleKey\": \"KAN-R8\", \"statusName\": \"Passed\"}"

      - name: Update Zephyr FAIL
        if: failure()
        run: |
          curl -i -X POST "https://prod-api.zephyr4jiracloud.com/v2/testexecutions" -H "Authorization: Bearer ${{ secrets.ZEPHYR_TOKEN }}" -H "Content-Type: application/json" -d "{\"projectKey\": \"KAN\", \"testCaseKey\": \"KAN-T8\", \"testCycleKey\": \"KAN-R8\", \"statusName\": \"Failed\"}"
