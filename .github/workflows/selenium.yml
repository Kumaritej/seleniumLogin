# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
name: AI Generate Tests + Zephyr Integration

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  generate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'

      - name: Generate test name using AI
        env:
          GEMINI_API_KEY: ${{ secrets.API_KEY }}
        run: |
          curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=$GEMINI_API_KEY" \
            -H "content-type: application/json" \
            -d '{
              "contents": [{"parts": [{"text": "Give ONE line test case name for testing invalid login with wrong username/password. Reply with ONLY the name."}]}]
            }' > raw_response_1.json
          cat raw_response_1.json
          jq -r '.candidates[0].content.parts[0].text' raw_response_1.json > testname.txt
          cat testname.txt

      - name: Generate test steps using AI
        env:
          GEMINI_API_KEY: ${{ secrets.API_KEY }}
        run: |
          curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=$GEMINI_API_KEY" \
            -H "content-type: application/json" \
            -d '{
              "contents": [{"parts": [{"text": "Write plain text test steps (numbered, one line per step) for testing invalid login with wrong username and password on a login page. Reply with ONLY the steps, no extra text."}]}]
            }' > raw_response_2.json
          cat raw_response_2.json
          jq -r '.candidates[0].content.parts[0].text' raw_response_2.json > teststeps.txt
          cat teststeps.txt

      - name: Create test case in Zephyr
        id: create_tc
        run: |
          TESTNAME=$(cat testname.txt)
          RESPONSE=$(curl -s -X POST "https://prod-api.zephyr4jiracloud.com/v2/testcases" \
            -H "Authorization: Bearer ${{ secrets.ZEPHYR_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"projectKey\": \"KAN\", \"name\": \"$TESTNAME\", \"objective\": \"AI generated test case\"}")
          echo "$RESPONSE"
          TCKEY=$(echo "$RESPONSE" | jq -r '.key')
          echo "testcasekey=$TCKEY" >> "$GITHUB_OUTPUT"

      - name: Add test steps to Zephyr test case
        run: |
          STEPS=$(cat teststeps.txt | jq -Rs .)
          curl -i -X POST "https://prod-api.zephyr4jiracloud.com/v2/testcases/${{ steps.create_tc.outputs.testcasekey }}/testscript" \
            -H "Authorization: Bearer ${{ secrets.ZEPHYR_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"type\": \"plain\", \"text\": $STEPS}"

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@latest

      - name: Run Tests
        run: mvn test
        continue-on-error: true

      - name: Update Zephyr PASS
        if: success()
        run: |
          curl -i -X POST "https://prod-api.zephyr4jiracloud.com/v2/testexecutions" \
            -H "Authorization: Bearer ${{ secrets.ZEPHYR_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"projectKey\": \"KAN\", \"testCaseKey\": \"${{ steps.create_tc.outputs.testcasekey }}\", \"testCycleKey\": \"KAN-R1\", \"statusName\": \"Pass\"}"

      - name: Update Zephyr FAIL
        if: failure()
        run: |
          curl -i -X POST "https://prod-api.zephyr4jiracloud.com/v2/testexecutions" \
            -H "Authorization: Bearer ${{ secrets.ZEPHYR_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"projectKey\": \"KAN\", \"testCaseKey\": \"${{ steps.create_tc.outputs.testcasekey }}\", \"testCycleKey\": \"KAN-R1\", \"statusName\": \"Fail\"}"
