# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
name: Automation Tests

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # Install Java 23
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'

      # Run Selenium Tests
      - name: Run Tests
        run: mvn test
        continue-on-error: true

      # Update Zephyr if tests passed
      - name: Update Zephyr PASS
        if: success()
        run: |
          curl -X POST "https://api.zephyrscale.smartbear.com/v2/testexecutions" \
            -H "Authorization: Bearer ${{ secrets.ZEPHYR_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "projectKey": "KAN",
              "testCaseKey": "KAN-T8",
              "testCycleKey": "KAN-R8",
              "statusName": "Passed"
            }'

      # Update Zephyr if tests failed
      - name: Update Zephyr FAIL
        if: failure()
        run: |
          curl -i -X POST "https://api.zephyrscale.smartbear.com/v2/testexecutions" \
            -H "Authorization: Bearer ${{ secrets.ZEPHYR_TOKEN}}" \
            -H "Content-Type: application/json" \
            -d '{
              "projectKey": "KAN",
              "testCaseKey": "KAN-T8",
              "testCycleKey": "KAN-R8",
              "statusName": "Failed"
            }'
